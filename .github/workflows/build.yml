# =============================================================================
# Build and push AstroLedger container image to registry.ring0.de
# =============================================================================
# Runs on every push to main and on semver tags (v*).
# The single image bundles the Go backend + embedded SvelteKit static frontend.
# Image: registry.ring0.de/lhw/astroledger/backend
#
# Required secrets (set in Forgejo repository settings → Secrets):
#   REGISTRY_USERNAME    — registry login (Forgejo username or token name)
#   REGISTRY_PASSWORD    — registry password or access token
# =============================================================================

name: Build Container Image

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

env:
  REGISTRY: registry.ring0.de
  IMAGE_PREFIX: registry.ring0.de/lhw/astroledger

jobs:
  # ---------------------------------------------------------------------------
  # Single image: Go backend + embedded SvelteKit static frontend
  # The Dockerfile multi-stage build: Node (frontend) → Go (embed + compile)
  # ---------------------------------------------------------------------------
  backend:
    name: Backend (with embedded frontend)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ secrets.REGISTRY_USERNAME }}
          password: ${{ secrets.REGISTRY_PASSWORD }}

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_PREFIX }}/backend
          tags: |
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./backend/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=registry,ref=${{ env.IMAGE_PREFIX }}/backend:buildcache
          cache-to: type=registry,ref=${{ env.IMAGE_PREFIX }}/backend:buildcache,mode=max
