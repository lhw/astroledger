services:
  # ---------------------------------------------------------------------------
  # Go backend — REST API + AMM engine + embedded SvelteKit frontend
  # ---------------------------------------------------------------------------
  backend:
    image: registry.ring0.de/lhw/astroledger/backend:latest
    restart: unless-stopped
    env_file:
      - path: .env
        required: false
    environment:
      ENVIRONMENT: production
      DB_PATH: /data/astroledger.db
      COOKIE_SECURE: "true"
      # Internal GoatCounter URL (Docker service name — never exposed externally)
      GOATCOUNTER_URL: http://goatcounter:8081
    volumes:
      - db-data:/data
    networks:
      - internal
    healthcheck:
      test: ["CMD", "wget", "-qO/dev/null", "http://localhost:8080/api/markets?limit=1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  # ---------------------------------------------------------------------------
  # GoatCounter — cookie-free, self-hosted analytics
  # Run once after first deploy: task gc:init
  # ---------------------------------------------------------------------------
  goatcounter:
    image: ghcr.io/arp242/goatcounter:latest
    restart: unless-stopped
    command:
      - serve
      - -listen=:8081
      - -db=${GC_DB:-sqlite+/data/goatcounter.db}
      - -tls=none
    volumes:
      - goatcounter-data:/data
    networks:
      - internal
    healthcheck:
      test: ["CMD", "wget", "-qO/dev/null", "http://localhost:8081/status"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  # ---------------------------------------------------------------------------
  # Caddy — HTTPS reverse proxy with automatic Let's Encrypt TLS
  # ---------------------------------------------------------------------------
  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "0.0.0.0:80:80"
      - "0.0.0.0:443:443"
      - "0.0.0.0:443:443/udp"   # HTTP/3 / QUIC
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    networks:
      - internal
    depends_on:
      - backend
      - goatcounter
    healthcheck:
      test: ["CMD", "wget", "-qO/dev/null", "http://localhost:2019/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s

networks:
  internal:
    driver: bridge

volumes:
  db-data:
  goatcounter-data:
  caddy-data:
  caddy-config:
