<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none" role="img" aria-label="AstroLedger">
  <!-- Background: deep charcoal, warm-tinted -->
  <rect width="64" height="64" rx="11" fill="#0E1117"/>

  <!-- Subtle corner stars — "astro" flavour -->
  <circle cx="9"  cy="9"  r="1.1" fill="#D4A843" opacity="0.35"/>
  <circle cx="55" cy="9"  r="0.8" fill="#D4A843" opacity="0.25"/>
  <circle cx="55" cy="55" r="1.1" fill="#D4A843" opacity="0.35"/>
  <circle cx="9"  cy="55" r="0.8" fill="#D4A843" opacity="0.25"/>

  <!-- ── Balance Scale ────────────────────────────────────────────── -->

  <!-- Vertical post: fulcrum down to base -->
  <line x1="32" y1="24" x2="32" y2="52" stroke="#C49B38" stroke-width="2.2" stroke-linecap="round"/>

  <!-- Base -->
  <line x1="22" y1="52" x2="42" y2="52" stroke="#C49B38" stroke-width="2.5" stroke-linecap="round"/>

  <!-- Beam — angled ~8° (left end higher, right end lower) -->
  <!-- Parametric check: at t=0.5 → y = 21 + 0.5*(27-21) = 24 ✓ passes through fulcrum -->
  <line x1="11" y1="21" x2="53" y2="27" stroke="#D4A843" stroke-width="2" stroke-linecap="round"/>

  <!-- Fulcrum knob -->
  <circle cx="32" cy="24" r="3.6" fill="#D4A843"/>
  <circle cx="32" cy="24" r="1.9" fill="#0E1117"/>

  <!-- ── Left pan (higher side — A) ── -->
  <!-- V-chains from beam end -->
  <line x1="11" y1="21" x2="8"  y2="34" stroke="#D4A843" stroke-width="1.3" stroke-linecap="round"/>
  <line x1="11" y1="21" x2="14" y2="34" stroke="#D4A843" stroke-width="1.3" stroke-linecap="round"/>
  <!-- Pan rod connecting chain ends -->
  <line x1="7"  y1="34" x2="15" y2="34" stroke="#D4A843" stroke-width="1.5" stroke-linecap="round"/>
  <!-- "A" as the pan -->
  <text x="11" y="44"
        text-anchor="middle"
        font-family="system-ui, 'Helvetica Neue', Arial, sans-serif"
        font-size="9" font-weight="700"
        fill="#D4A843">A</text>

  <!-- ── Right pan (lower side — L) ── -->
  <!-- V-chains from beam end -->
  <line x1="53" y1="27" x2="50" y2="41" stroke="#D4A843" stroke-width="1.3" stroke-linecap="round"/>
  <line x1="53" y1="27" x2="56" y2="41" stroke="#D4A843" stroke-width="1.3" stroke-linecap="round"/>
  <!-- Pan rod -->
  <line x1="49" y1="41" x2="57" y2="41" stroke="#D4A843" stroke-width="1.5" stroke-linecap="round"/>
  <!-- "L" as the pan -->
  <text x="53" y="51"
        text-anchor="middle"
        font-family="system-ui, 'Helvetica Neue', Arial, sans-serif"
        font-size="9" font-weight="700"
        fill="#D4A843">L</text>
</svg>
