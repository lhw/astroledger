version: '3'

vars:
  BINARY: bin/astroledger
  DB_PATH: '{{.DB_PATH | default "./astroledger.db"}}'

tasks:
  default:
    desc: List available tasks
    cmds:
      - task --list

  dev:
    desc: |
      Run the backend with Air live-reload (recompiles on Go file changes).
      Air must be installed first: go install github.com/air-verse/air@latest
      Config lives in .air.toml — binary is built to ./tmp/main.
    cmds:
      - air
    env:
      ENVIRONMENT: development
      COOKIE_SECURE: 'false'
      CORS_ALLOWED_ORIGINS: 'http://localhost:5173'
      FRONTEND_URL: 'http://localhost:5173'

  install:air:
    desc: Install Air live-reload tool (go install)
    cmds:
      - go install github.com/air-verse/air@latest

  run:
    desc: Run the server directly (no hot reload)
    cmds:
      - go run ./cmd/server
    env:
      ENVIRONMENT: development
      COOKIE_SECURE: 'false'
      CORS_ALLOWED_ORIGINS: 'http://localhost:5173'
      FRONTEND_URL: 'http://localhost:5173'

  build:
    desc: Build the production binary
    cmds:
      - mkdir -p bin
      - go build -ldflags="-s -w" -o {{.BINARY}} ./cmd/server

  build:mcp:
    desc: Build the MCP server binary
    cmds:
      - mkdir -p bin
      - go build -ldflags="-s -w" -o bin/astroledger-mcp ./cmd/mcp

  run:mcp:
    desc: Run the MCP server (for testing)
    cmds:
      - go run ./cmd/mcp
    env:
      ASTROLEDGER_BOT_TOKEN: '{{.ASTROLEDGER_BOT_TOKEN | default ""}}'
      ASTROLEDGER_API_URL: '{{.ASTROLEDGER_API_URL | default "https://astroledger.de"}}'

  test:
    desc: Run all tests
    cmds:
      - go test -race -count=1 ./...

  test:verbose:
    desc: Run tests with verbose output
    cmds:
      - go test -race -count=1 -v ./...

  lint:
    desc: Run golangci-lint
    cmds:
      - golangci-lint run ./...

  fmt:
    desc: Format all Go code
    cmds:
      - gofmt -w .

  vet:
    desc: Run go vet
    cmds:
      - go vet ./...

  migrate:
    desc: Apply all pending database migrations
    cmds:
      - go run ./cmd/server -migrate-only
    env:
      DB_PATH: '{{.DB_PATH}}'

  migrate:status:
    desc: Show migration status
    cmds:
      - go run ./cmd/server -migrate-status
    env:
      DB_PATH: '{{.DB_PATH}}'

  migrate:create:
    desc: Create a new migration file (NAME= required)
    cmds:
      - goose -dir migrations create {{.NAME}} sql

  generate:
    desc: Run sqlc code generation
    cmds:
      - sqlc generate

  tidy:
    desc: Tidy go modules
    cmds:
      - go mod tidy

  seed:
    desc: Seed the database with sample markets in all lifecycle states
    cmds:
      - go run ./cmd/seed
    env:
      DB_PATH: '{{.DB_PATH}}'

  seed:clean:
    desc: Delete all data then re-seed with sample markets
    cmds:
      - go run ./cmd/seed -clean
    env:
      DB_PATH: '{{.DB_PATH}}'

  clean-db:
    desc: Delete all application data while keeping the schema (migrations are preserved)
    cmds:
      - go run ./cmd/seed -clean-only
    env:
      DB_PATH: '{{.DB_PATH}}'

  setup:
    desc: Initial setup — download deps and run migrations
    cmds:
      - task: tidy
      - task: migrate
