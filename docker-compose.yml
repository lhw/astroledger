services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file: .env
    environment:
      # Override DB_PATH to write into the mounted volume
      DB_PATH: /data/scolymarket.db
      COOKIE_SECURE: "true"
    volumes:
      - db-data:/data
    networks:
      - internal

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      # ORIGIN must be the external HTTPS URL — required by SvelteKit adapter-node
      # Set this in .env or override inline: ORIGIN=https://yourdomain.com
      ORIGIN: ${ORIGIN}
      NODE_ENV: production
    networks:
      - internal

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"  # HTTP/3
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    networks:
      - internal
    depends_on:
      - backend
      - frontend

networks:
  internal:

volumes:
  db-data:
  caddy-data:
  caddy-config:
